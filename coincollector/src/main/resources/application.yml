coincollector:
  db-file: coincollector.db
  port: 8080
  table:
    user: users
    euroCoin: euroCoins
    euroCoinType: euroCoinTypes
    euroCoinCollection: euroCoinCollections
    euroCoinCollectionGroup: euroCoinCollectionGroups

spring:
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:sqlite:./${coincollector.db-file}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history

server:
  shutdown: graceful
